name: Scrub ingest runs
# A repository_dispatch payload is plaintext and stays visible in the run's event data.
# Once an ingest run finishes (success or failure), delete the run so no plaintext lingers.
on:
  workflow_run:
    workflows: [Ingest health]
    types: [completed]

permissions: {}

jobs:
  scrub:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the finished ingest run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "ingest run concluded: $CONCLUSION"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
